name: Syntaxprüfung Unterkunftsrecherche

on:
  pull_request:
    branches: ["main"]
    paths:
      - "worker/src/index.js"
      - "admin.html"
      - ".github/workflows/check-research-pr.yml"
  push:
    branches: ["fix/unterkunft-recherche-details"]
    paths:
      - "worker/src/index.js"
      - "admin.html"
      - ".github/workflows/check-research-pr.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript-Syntax prüfen (ohne Deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker-Syntax prüfen
        run: node --input-type=module --check < worker/src/index.js
      - name: JavaScript in admin.html prüfen
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import tempfile, subprocess

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.scripts.append("".join(self.parts))
                      self.in_script = False

          parser = Scripts()
          parser.feed(Path("admin.html").read_text(encoding="utf-8"))
          inline = [s for s in parser.scripts if s.strip()]
          if not inline:
              raise SystemExit("Keine Inline-Skripte zum Prüfen gefunden.")
          with tempfile.TemporaryDirectory() as tmp:
              for i, source in enumerate(inline, 1):
                  path = Path(tmp) / f"script-{i}.mjs"
                  path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(path)], check=True)
          print(f"{len(inline)} Inline-Skript(e) syntaktisch geprüft.")
          PY
