name: Website veröffentlichen

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: GitHub Pages aktivieren und konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Einstellung für „ab“-Preis auf Unterkunftskacheln absichern
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-tile-key="show_tile_price_ab"' admin.html
          grep -Fq 'show_tile_price_ab:editArea.querySelector' admin.html
          grep -Fq "const showTileAb=a.show_tile_price_ab" index.html
          grep -Fq "(showTileAb?'ab ':'')" index.html
          echo "Preispräfix-Einstellung in Verwaltung und öffentlicher Anzeige vorhanden."
      - name: Website-Dateien bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Browser-Test der veröffentlichten Unterkunftsseite
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              let loaded = false;
              for (let attempt = 1; attempt <= 5 && !loaded; attempt++) {
                await page.goto('https://msc2604.github.io/unterkuenfte-am-tegernsee/?smoke=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(6000);
                const cards = await page.locator('.result-card').count();
                const errorMessage = await page.locator('#resultsGrid').innerText().catch(() => '');
                if (cards > 0) {
                  console.log('Website browser test passed; rendered accommodation cards:', cards);
                  loaded = true;
                } else {
                  console.log('Waiting for published page/data; attempt', attempt, 'message:', errorMessage.slice(0, 250));
                  await page.waitForTimeout(5000);
                }
              }
              if (!loaded) throw new Error('No accommodation cards rendered on the live website.');
              const cards = page.locator('.result-card');
              const cardCount = await cards.count();
              for (let i = 0; i < cardCount; i++) {
                const card = cards.nth(i);
                const toggle = card.locator('.details-toggle');
                if (await toggle.count()) await toggle.click();
                const unitCount = await card.locator('.result-unit').count();
                const advertisedCount = await card.locator('.result-unit-count').innerText().catch(() => '');
                if (advertisedCount) {
                  const expected = Number(advertisedCount.match(/\d+/)?.[0]);
                  if (Number.isFinite(expected) && expected !== unitCount) {
                    throw new Error('Unit count mismatch for ' + await card.locator('h3').innerText() + ': label=' + expected + ', details=' + unitCount);
                  }
                }
                const tilePrice = (await card.locator('.result-card-body > .result-price').innerText().catch(() => '')).trim();
                console.log('Card:', (await card.locator('h3').innerText()), '| visible unit offers:', unitCount, '| card label:', advertisedCount || 'none', '| tile price:', tilePrice || 'none');
              }
              if (pageErrors.length) throw new Error('Browser JavaScript errors: ' + pageErrors.join(' | '));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
