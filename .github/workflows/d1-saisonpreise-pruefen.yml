name: D1-Saisonpreise sicher prüfen
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/d1-saisonpreise-pruefen.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-saisonpreise-pruefen
  cancel-in-progress: false
jobs:
  inspect:
    name: Zeitreise-Zeitpunkte nur lesend prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Wrangler einrichten
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 info unterkuenfte-am-tegernsee
      - name: Historische Zeitpunkte prüfen (keine Wiederherstellung)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          cd worker
          for days in 0 1 2 3 4 5 6 7; do
            timestamp="$(date -u -d "$days days ago" '+%Y-%m-%dT%H:%M:%SZ')"
            echo "===== Zeitprüfung: $timestamp ====="
            npx wrangler d1 time-travel info unterkuenfte-am-tegernsee --timestamp="$timestamp" || true
          done
          echo "===== Ende: Es wurde nichts wiederhergestellt oder verändert. ====="
